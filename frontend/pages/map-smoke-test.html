<!doctype html><html><head><meta charset="utf-8"><title>Map smoke check</title><style>html,body,#map{height:100%;margin:0}</style></head><body><div id="map"></div><pre id="result">WAIT</pre><script src="/js/location.js"></script><script>
const stations = [
{id:'STN_001',name:'AquaTer',coords:{lat:7.819100,lng:123.441200}},
{id:'STN_010',name:'AQUAWATER',coords:{lat:7.828000,lng:123.438000}},
{id:'STN_005',name:'AquaWorld',coords:{lat:7.829000,lng:123.439000}},
{id:'STN_006',name:'ClearSpring 1',coords:{lat:7.830000,lng:123.440000}},
{id:'STN_009',name:'ClearSpring 2',coords:{lat:7.832000,lng:123.442000}},
{id:'STN_002',name:'DRINK n REFILL',coords:{lat:7.827330,lng:123.444185}},
{id:'STN_011',name:'H2O',coords:{lat:7.833000,lng:123.445000}},
{id:'STN_003',name:'PG Aquamaster',coords:{lat:7.819800,lng:123.429700}},
{id:'STN_004',name:'PH2O',coords:{lat:7.836200,lng:123.426400}},
{id:'STN_007',name:'Ultra Pure',coords:{lat:7.831200,lng:123.443700}},

{id:'STN_ALKA',name:'Alka',coords:{lat:7.840580,lng:123.463360}}
];
const errors=[]; addEventListener('error',e=>errors.push(e.message||e.type)); addEventListener('unhandledrejection',e=>errors.push(String(e.reason))); const oldError=console.error; console.error=(...args)=>{errors.push(args.join(' '));oldError(...args)};
AquaLocation.initLocationMap('map',{stations}).then(handle=>{const markers=[];handle.map.eachLayer(l=>{if(l instanceof L.Marker)markers.push(l)});const pins=markers.filter(m=>m.options.title!=='Your location');const accurate=pins.length===stations.length&&stations.every(s=>pins.some(m=>{const p=m.getLatLng();return Math.abs(p.lat-s.coords.lat)<1e-9&&Math.abs(p.lng-s.coords.lng)<1e-9}));document.querySelector('#result').textContent=JSON.stringify({leaflet:L.version,stationPins:pins.length,allAtExpectedLatLng:accurate,defaultCenter:AquaLocation.DEFAULT_CENTER,errors});}).catch(e=>document.querySelector('#result').textContent=JSON.stringify({error:String(e),errors}));
</script></body></html>
