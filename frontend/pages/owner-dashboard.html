<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b4c">
  <title>AquaTracker — Station Owner Workspace</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/logo/favicon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/logo/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/logo/favicon-180.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="owner-dashboard">

  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar">
      <a class="mark mark-compact" href="/">
        <img src="/assets/logo/aquatracker-icon-teal-light.png" alt="AquaTracker logo" class="mark-icon-img">
        <span>Aqua<span class="mark-accent">Tracker</span></span>
      </a>

      <div class="account-chip" id="user-chip">
        <span class="avatar" id="user-avatar">JD</span>
        <div>
          <strong id="user-name">Joan Dela Cruz</strong>
          <small id="user-role-label">ClearSpring Water Hub</small>
        </div>
      </div>

      <nav class="side-nav" id="side-nav">
        <!-- Rendered dynamically by roles.js -->
      </nav>

      <a class="signout" href="#" onclick="AquaAuth.logout(); return false;">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </a>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="mobile-menu">
          <button type="button" id="mobile-toggle" aria-label="Toggle Navigation">☰</button>
        </div>

        <div>
          <small id="view-eyebrow">Station Owner Workspace</small>
          <h1 id="view-title">Station Operations</h1>
        </div>

        <div class="top-actions">
          <div class="top-account">
            <strong id="top-name">Joan Dela Cruz</strong>
            <small id="top-subtitle">ClearSpring Water Hub</small>
          </div>
          <span class="avatar pale" id="top-avatar">JD</span>
        </div>
      </header>

      <main class="content" id="main-content">
        <!-- Dynamic Section Views injected here via owner-dashboard.js -->
      </main>
    </section>
  </div>

  <!-- Shared Modal Container -->
  <div class="glass-modal-backdrop" id="modal-backdrop">
    <div class="glass-modal" id="modal-content">
      <!-- Injected modal body -->
    </div>
  </div>

  <script src="/js/roles.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/owner-dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Enforce Role Guard: Only 'owner' role allowed
      const user = await AquaAuth.requireRole('owner');
      if (!user) return;

      AquaCommon.initStore();
      AquaDashboard.initDataStores();
      setUser(user);
      // 2. Hydrate user info & dynamic nav
      hydrateUserDisplay(user);
      renderNavigation(user);

      document.getElementById('mobile-toggle')?.addEventListener('click', () => {
        document.getElementById('sidebar')?.classList.toggle('open');
      });

      // 3. Open requested section or the Overview.
      await switchSection(window.location.hash.slice(1) || 'overview');
    });

    function hydrateUserDisplay(user) {
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('top-name').textContent = user.name;
      const initials = (user.name || 'OW').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('user-avatar').textContent = initials;
      document.getElementById('top-avatar').textContent = initials;
      document.getElementById('user-role-label').textContent = user.subtitle || 'Station Owner';
      document.getElementById('top-subtitle').textContent = user.subtitle || 'Station Owner';
    }

    function renderNavigation(user) {
      const navContainer = document.getElementById('side-nav');
      const navItems = AquaRoles.getAuthorizedNav(user);
      navContainer.innerHTML = navItems.map(item => `
        <button type="button" data-section="${item.section}">
          ${getSvgIcon(item.icon)}
          <span>${item.label}</span>
        </button>
      `).join('');
      navContainer.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', async () => {
          await switchSection(button.dataset.section);
          document.getElementById('sidebar')?.classList.remove('open');
        });
      });
    }

    function getSvgIcon(name) {
      const icons = {
        'grid': '<svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
        'package': '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
        'repeat': '<svg class="nav-icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13V15a4 4 0 0 1-4 4H3"/></svg>',
        'users': '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        'user-check': '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>',
        'tag': '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2.83 13.41a2 2 0 0 1 0-2.83l7.17-7.17a2 2 0 0 1 2.83 0l7.17 7.17a2 2 0 0 1 0 2.83z"/><line x1="10" y1="5" x2="10" y2="19"/><line x1="14" y1="5" x2="14" y2="19"/></svg>',
        'settings': '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4 9.4a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H//9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1 1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82z"/></svg>',
        'user': '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
      };
      return icons[name] || icons['grid'];
    }
  </script>
</body>
</html>
