# ============================================================================
#  AquaTracker database server  -  standalone MySQL instance
#
#  Started by php-backend/start-aquatracker.bat. You do not normally need to
#  touch this file; it exists so the instance is reproducible and documented.
#
#      mysqld.exe --defaults-file="<this file>" --standalone
#
#  Why a separate instance instead of XAMPP's bundled MariaDB?
#  ------------------------------------------------------------
#  XAMPP ships MariaDB 10.4.32. On this machine that build is not usable:
#
#    * it asserted at startup, before any AquaTracker traffic at all -
#      "InnoDB: Failing assertion: slot" at os0file.cc:6132;
#    * under load it deadlocked inside InnoDB on a lost buffer-pool latch
#      (reserved by "thread id 0", never released) while holding DICT_SYS
#      exclusively, then killed itself after 600s:
#      "InnoDB: Semaphore wait has lasted > 600 seconds. We intentionally
#       crash the server because it appears to be hung."
#
#  Those are engine bugs, not application problems, and no schema change fixes
#  them. This instance uses the MySQL Server 26.7 binaries already installed on
#  the machine instead.
#
#  Why a fresh data directory?
#  ----------------------------
#  The existing data directory,
#  C:\ProgramData\MySQL\MySQL Server 26.7\Data, is owned by the MySQL267 service
#  (NetworkService) and is access-denied for a normal user, so the service
#  cannot be reconfigured or started without elevation. A private data
#  directory sidesteps that entirely and also keeps AquaTracker completely
#  isolated from the other databases on this machine.
#
#  Port 3306, not 3306, so this can never collide with a MySQL/MariaDB server
#  the user starts later on the default port.
# ============================================================================

[mysqld]
basedir   = "C:/Program Files/MySQL/MySQL Server 26.7"
datadir   = "C:/xampp/mysql/data-aquatracker"
port      = 3306
bind-address = 127.0.0.1

# Keep everything in this one directory so there is nothing to clean up.
socket    = "C:/xampp/mysql/data-aquatracker/mysql.sock"
pid_file  = "C:/xampp/mysql/data-aquatracker/mysqld.pid"
log_error = "C:/xampp/mysql/data-aquatracker/error.log"

# utf8mb4 end to end; the schema also pins utf8mb4_unicode_ci per table.
character-set-server = utf8mb4

# 128 MB. XAMPP's my.ini uses 16 MB, which is small enough to make even a
# student-sized project look like it is thrashing.
innodb_buffer_pool_size = 128M

# Do not start the X Plugin: it would claim 33060 and is not used here.
mysqlx = 0

# This is a local dev database reached only over loopback.
max_connections = 100
table_open_cache = 400

[client]
port    = 3306
default-character-set = utf8mb4

[mysql]
port    = 3306
default-character-set = utf8mb4

[mysqldump]
port    = 3306